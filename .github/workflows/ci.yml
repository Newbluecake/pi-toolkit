name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # fs.globSync (session-driver) is Node 22+; package.json engines pins this too
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build web UI
        run: npm run build:web && npm run check:web

      - name: Test
        run: npm test
        env:
          PWH_REQUIRE_UI_DIST: "1"

      - name: Build
        run: npm run build

  # The web UI toolchain (mermaid declares engines.node >=22.12.0, vite/rollup follow) must keep building on the
  # LOWEST supported Node. The runtime floor stays >=22 (pi installs with --omit=dev, so devDependencies never
  # reach users). web-hub-mermaid plan §2.4 / §12.
  web-min-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci

      - name: Build web UI on the minimum Node
        run: npm run build:web && npm run check:web
