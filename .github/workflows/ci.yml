name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # fs.globSync (session-driver) is Node 22+; package.json engines pins this too
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build web UI
        run: npm run build:web && npm run check:web

      # startup-bundle plan r3 §6.3: the bundle gates run BEFORE the test suite (the dispatcher
      # suite asserts the on-disk artifact matches a fresh build), and they enforce reproducibility,
      # the 6 MB budget, src-only inputs and zero dynamic imports.
      - name: Build bundle (gated)
        run: npm run build:bundle

      - name: Test (tier 1)
        id: tier1
        run: npm run test:tier1
        env:
          PWH_REQUIRE_UI_DIST: "1"
          # Fewer workers than the 4-vCPU runner allows: CI time is cheap, and the timing-sensitive
          # tests (real hub children, perf ratios) flake under CPU contention.
          PI_TOOLKIT_TEST_WORKERS: "2"

      # The runner image lacks zsh, and some /etc/profile.d targets are world-writable;
      # the terminal fixture rejects those targets under its threat model.
      - name: Prepare terminal tier 2 runner (zsh, system rc permissions)
        if: ${{ !cancelled() && (steps.tier1.outcome == 'success' || steps.tier1.outcome == 'failure') }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh
          command -v zsh
          ls -lL /etc/profile /etc/bash.bashrc /etc/zsh/* /etc/profile.d/ 2>/dev/null || true
          sudo find -L /etc/profile /etc/bashrc /etc/bash.bashrc /etc/zsh /etc/zshenv /etc/zshrc /etc/zprofile /etc/zlogin /etc/locale.conf /etc/profile.d -maxdepth 1 -type f -perm /022 -print -exec chmod go-w {} + 2>/dev/null || true
          ! sudo find -L /etc/profile.d -maxdepth 1 -type f -perm /002 | grep -q .

      # test-speed plan D7: tier 2 (env-sensitive: integration, conformance, real mounts) runs only
      # once tier 1 actually executed — if npm ci or a build step failed, tier 1 was skipped and
      # tier 2 must not run either; !cancelled() keeps it from starting on cancellation. The
      # real-mount secure suites keep self-skipping on runners without FUSE (status quo).
      - name: Test (tier 2 + secure)
        if: ${{ !cancelled() && (steps.tier1.outcome == 'success' || steps.tier1.outcome == 'failure') }}
        run: npm run test:tier2
        env:
          PWH_REQUIRE_UI_DIST: "1"
          PI_TOOLKIT_TEST_WORKERS: "2"

      - name: Build
        run: npm run build

  # The web UI toolchain (mermaid declares engines.node >=22.12.0, vite/rollup follow) must keep building on the
  # LOWEST supported Node. The runtime floor stays >=22 (pi installs with --omit=dev, so devDependencies never
  # reach users). web-hub-mermaid plan §2.4 / §12.
  web-min-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci

      - name: Build web UI on the minimum Node
        run: npm run build:web && npm run check:web

      # traffic recording needs node:sqlite — unflagged only from 22.13 on. Prove the floor still
      # loads it (the script self-re-execs with --experimental-sqlite on 22.5-22.12).
      # traffic-merge plan r3 §3.1/§8.4. No npm deps needed (pure node builtins), <1s.
      - name: Traffic node:sqlite smoke on the minimum Node
        run: node scripts/traffic/node-floor-smoke.mjs
