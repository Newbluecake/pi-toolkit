name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # fs.globSync (session-driver) is Node 22+; package.json engines pins this too
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build web UI
        run: npm run build:web && npm run check:web

      - name: Test
        run: npm test
        env:
          PWH_REQUIRE_UI_DIST: "1"
          # Fewer workers than the 4-vCPU runner allows: CI time is cheap, and the timing-sensitive
          # integration tests (real hub children, perf ratios) flake under CPU contention.
          PI_TOOLKIT_TEST_WORKERS: "2"

      - name: Build
        run: npm run build

  # The web UI toolchain (mermaid declares engines.node >=22.12.0, vite/rollup follow) must keep building on the
  # LOWEST supported Node. The runtime floor stays >=22 (pi installs with --omit=dev, so devDependencies never
  # reach users). web-hub-mermaid plan §2.4 / §12.
  web-min-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci

      - name: Build web UI on the minimum Node
        run: npm run build:web && npm run check:web

      # traffic recording needs node:sqlite — unflagged only from 22.13 on. Prove the floor still
      # loads it (the script self-re-execs with --experimental-sqlite on 22.5-22.12).
      # traffic-merge plan r3 §3.1/§8.4. No npm deps needed (pure node builtins), <1s.
      - name: Traffic node:sqlite smoke on the minimum Node
        run: node scripts/traffic/node-floor-smoke.mjs
