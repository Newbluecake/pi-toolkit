<!doctype html>
<html lang="en" data-auth-mode="__AUTH_MODE__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- lang is corrected to the detected UI language at boot (src/main.ts); this meta keeps
         Chrome's translate offer off even before/without that (the UI is bilingual i18n). -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#0b7a70" />
    <!-- Android PWA (2026-10-07): install manifest. No service worker on purpose — the data is
         live and the hub serves bytes from memory; caching would only fight the hub's own
         version-supersede checks. NOTE: Chrome's full standalone install needs a secure
         context — plain-HTTP LAN users whitelist the origin once via
         chrome://flags/#unsafely-treat-insecure-origin-as-secure. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS home-screen install (2026-10-18): same no-service-worker rationale as above — the
         data is live, caching would fight the hub's version-supersede checks. apple-touch-icon
         is pre-flattened onto the teal (iOS composites transparency onto black); status bar
         `black` matches the dark theme (#0d1417) — `black-translucent` would push content
         under the clock, and only the bottom/left/right safe-areas are padded today. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>pi web-hub</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
